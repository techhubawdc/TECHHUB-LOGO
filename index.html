<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TECH HUB</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         WELCOME SCREEN
    ========================== -->

    <section id="welcomeScreen" class="screen active">

        <div class="welcomeContent">

            <p class="topText">
                A NEW JOURNEY BEGINS
            </p>

            <h1>WELCOME</h1>

            <div class="welcomeLine"></div>

            <p class="techSmall">
                TECH HUB
            </p>

        </div>

    </section>


    <!-- =========================
         NAME + DEPARTMENT SCREEN
    ========================== -->

    <section id="formScreen" class="screen">

        <div class="formCard">

            <div class="miniBadge">
                TH
            </div>

            <p class="formTop">
                WELCOME TO
            </p>

            <h1>
                TECH HUB
            </h1>

            <p class="subtitle">
                Where Ideas Turn Into Impact
            </p>


            <!-- NAME -->

            <div class="inputBox">

                <label>
                    YOUR NAME
                </label>

                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your name"
                    autocomplete="off"
                >

            </div>


            <!-- DEPARTMENT -->

            <div class="inputBox">

                <label>
                    YOUR DEPARTMENT
                </label>

                <input
                    type="text"
                    id="departmentInput"
                    placeholder="Enter your department"
                    autocomplete="off"
                >

            </div>


            <!-- FACULTY / STUDENT -->

            <div class="inputBox">

                <label>
                    YOU ARE A
                </label>

                <div class="roleOptions">

                    <label class="roleOption">

                        <input
                            type="radio"
                            name="role"
                            value="Faculty"
                        >

                        <span>
                            Faculty
                        </span>

                    </label>


                    <label class="roleOption">

                        <input
                            type="radio"
                            name="role"
                            value="Student"
                        >

                        <span>
                            Student
                        </span>

                    </label>

                </div>

            </div>


            <!-- ENTER -->

            <button id="enterBtn">

                ENTER
                <span>→</span>

            </button>

            <p class="hint">
                Press ENTER to begin the experience
            </p>

        </div>

    </section>


    <!-- =========================
         BOOM SCREEN
    ========================== -->

    <section id="boomScreen" class="screen">

        <div id="particles"></div>

        <div id="countText">
            3
        </div>

        <div id="awdcText">
            AWDC
        </div>

        <div id="boomText">
            💥
        </div>

    </section>


    <!-- =========================
         LOGO SCREEN
    ========================== -->

    <section id="logoScreen" class="screen">

        <div class="logoContent">

            <!-- KEEP YOUR LOGO FILE -->
            <img
                src="techhub-logo.png"
                alt="TECH HUB Logo"
                id="techHubLogo"
            >

            <h1>
                TECH HUB
            </h1>

            <p id="welcomeName">
                Welcome!
            </p>

            <p id="departmentText">
                DEPARTMENT
            </p>

            <p id="roleText">
                ROLE
            </p>

        </div>

    </section>


    <!-- =========================
         THANK YOU SCREEN
    ========================== -->

    <section id="thankScreen" class="screen">

        <div class="thankContent">

            <h1>
                THANK YOU
            </h1>

            <div class="thankLine"></div>

            <p>
                Thank you for being a part of
            </p>

            <h2>
                TECH HUB
            </h2>

            <div class="finalMessage">
                Unwrap the Unexperienced
            </div>

            <div class="stars">
                ✦ ✦ ✦
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
